    <!-- OpenAlgo Universal In-Page Copilot & Drawer System -->
    <style>
      #oa-inpage-copilot-drawer {
        width: 420px;
        min-width: 420px;
        height: 100%;
        background: #090e1a;
        border-left: 1px solid rgba(255, 255, 255, 0.08);
        display: flex;
        flex-direction: column;
        z-index: 40;
        transition: width 0.25s cubic-bezier(0.16, 1, 0.3, 1), margin-right 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        position: relative;
      }
      #oa-inpage-copilot-drawer.collapsed {
        width: 0 !important;
        min-width: 0 !important;
        margin-right: -10px;
        overflow: hidden;
        border-left-color: transparent;
      }
      .oa-drawer-tab-hdr {
        height: 42px;
        background: #060a14;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 10px;
        shrink: 0;
      }
      .oa-tab-btn {
        padding: 4px 8px;
        border-radius: 6px;
        font-size: 0.72rem;
        font-weight: 700;
        color: #94a3b8;
        background: transparent;
        border: 1px solid transparent;
        cursor: pointer;
        transition: all 0.15s;
      }
      .oa-tab-btn:hover { color: #f8fafc; background: rgba(255, 255, 255, 0.05); }
      .oa-tab-btn.active.tab-gemini { color: #c084fc; background: rgba(192, 132, 252, 0.15); border-color: rgba(192, 132, 252, 0.3); }
      .oa-tab-btn.active.tab-feed { color: #38bdf8; background: rgba(56, 189, 248, 0.15); border-color: rgba(56, 189, 248, 0.3); }
      .oa-tab-btn.active.tab-broker { color: #34d399; background: rgba(52, 211, 153, 0.15); border-color: rgba(52, 211, 153, 0.3); }
      .oa-pane { flex: 1; display: none; flex-direction: column; min-height: 0; overflow-y: auto; }
      .oa-pane.active { display: flex; }
      .oa-chip { padding: 4px 8px; border-radius: 9999px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); color: #94a3b8; font-size: 0.68rem; font-weight: 600; cursor: pointer; white-space: nowrap; }
      .oa-chip:hover { color: #38bdf8; border-color: rgba(56,189,248,0.4); background: rgba(56,189,248,0.1); }
      .oa-chat-bubble { padding: 10px 12px; border-radius: 8px; font-size: 0.78rem; line-height: 1.5; margin-bottom: 10px; }
      .oa-chat-bubble.user { align-self: flex-end; background: #0284c7; color: #fff; max-width: 90%; }
      .oa-chat-bubble.assistant { align-self: flex-start; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); color: #f8fafc; width: 100%; }
      .oa-chat-bubble table { width: 100%; border-collapse: collapse; margin: 8px 0; font-size: 0.72rem; }
      .oa-chat-bubble th, .oa-chat-bubble td { border: 1px solid rgba(255,255,255,0.1); padding: 4px; }
      .oa-btn-toggle-top {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 32px;
        padding: 0 10px;
        border-radius: 6px;
        font-size: 0.75rem;
        font-weight: 700;
        cursor: pointer;
        background: rgba(192, 132, 252, 0.15);
        color: #c084fc;
        border: 1px solid rgba(192, 132, 252, 0.35);
        margin-left: 8px;
        transition: all 0.15s;
      }
      .oa-btn-toggle-top:hover { background: rgba(192, 132, 252, 0.25); color: #d8b4fe; }
    </style>

  <body>
    <div id="root"></div>

    <script>
      (function() {
        let isDrawerOpen = true;
        let activeTab = 'gemini';

        function checkAndInjectTradingCopilot() {
          const isTradingPage = window.location.pathname === '/trading' || window.location.pathname === '/' || window.location.pathname === '/copilot';
          const mainElem = document.querySelector('main');
          const existingDrawer = document.getElementById('oa-inpage-copilot-drawer');

          if (!isTradingPage) {
            if (existingDrawer) existingDrawer.style.display = 'none';
            const topBtn = document.getElementById('oa-copilot-top-trigger');
            if (topBtn) topBtn.style.display = 'none';
            return;
          }

          if (existingDrawer) {
            existingDrawer.style.display = 'flex';
            const topBtn = document.getElementById('oa-copilot-top-trigger');
            if (topBtn) topBtn.style.display = 'inline-flex';
            return;
          }

          if (!mainElem) return;

          // 1. Inject Top Action Button in Navbar or Toolbar
          injectTopButton();

          // 2. Build Drawer DOM
          const drawer = document.createElement('aside');
          drawer.id = 'oa-inpage-copilot-drawer';
          drawer.innerHTML = `
            <div class="oa-drawer-tab-hdr">
              <div style="display:flex; gap:4px;">
                <button class="oa-tab-btn tab-gemini active" onclick="window.oaSwitchTab('gemini')">✨ Copilot</button>
                <button class="oa-tab-btn tab-feed" onclick="window.oaSwitchTab('feed')">⚡ Dhan Feed</button>
                <button class="oa-tab-btn tab-broker" onclick="window.oaSwitchTab('broker')">🔌 Broker</button>
              </div>
              <button style="background:none; border:none; color:#94a3b8; cursor:pointer; font-size:14px; padding:4px;" onclick="window.oaToggleDrawer()">✕</button>
            </div>

            <!-- Tab 1: Gemini Copilot -->
            <div class="oa-pane active" id="oa-pane-gemini" style="padding:10px;">
              <div style="display:flex; justify-content:space-between; padding:6px 8px; background:rgba(0,0,0,0.3); border-radius:6px; font-size:0.72rem; font-family:monospace; margin-bottom:8px; border:1px solid rgba(255,255,255,0.06);">
                <span>Symbol: <strong style="color:#38bdf8;" id="oaCtxSymbol">BHEL</strong></span>
                <span>Exch: <strong id="oaCtxExch">BSE</strong></span>
                <span>TF: <strong id="oaCtxTf">1m</strong></span>
                <span>LTP: <strong style="color:#f87171;" id="oaCtxLtp">₹416.90</strong></span>
              </div>
              <div style="display:flex; gap:4px; overflow-x:auto; margin-bottom:8px; padding-bottom:2px;">
                <button class="oa-chip" onclick="window.oaAsk('Analyze Trend & Momentum for active chart.')">⚡ Trend</button>
                <button class="oa-chip" onclick="window.oaAsk('Identify Key Support & Resistance levels.')">🎯 S&R Zones</button>
                <button class="oa-chip" onclick="window.oaAsk('Calculate RSI & EMA Confluence.')">📊 RSI / EMA</button>
                <button class="oa-chip" onclick="window.oaAsk('Analyze Option Chain PCR and Open Interest.')">📈 Options OI</button>
              </div>
              <div style="flex:1; overflow-y:auto; padding-right:2px;" id="oaChatFeed">
                <div class="oa-chat-bubble assistant">
                  <strong>✨ OpenAlgo Quantitative Copilot</strong><br>
                  Connected directly to your chart and live <strong>Dhan Market Data API</strong> feed. Select a prompt above or ask any quantitative query.
                </div>
              </div>
              <form style="display:flex; gap:6px; margin-top:8px; padding-top:6px; border-top:1px solid rgba(255,255,255,0.08);" onsubmit="event.preventDefault(); window.oaAsk(document.getElementById('oaChatInput').value);">
                <input type="text" id="oaChatInput" style="flex:1; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1); border-radius:9999px; padding:6px 12px; color:#fff; font-size:0.75rem; outline:none;" placeholder="Ask Gemini about active chart setup..." autocomplete="off">
                <button type="submit" style="width:28px; height:28px; border-radius:50%; background:#38bdf8; border:none; color:#000; font-weight:bold; cursor:pointer; display:flex; align-items:center; justify-content:center;">➤</button>
              </form>
            </div>

            <!-- Tab 2: Dhan Feed -->
            <div class="oa-pane" id="oa-pane-feed" style="padding:10px; gap:10px;">
              <div style="background:rgba(255,255,255,0.03); padding:10px; border-radius:8px; border:1px solid rgba(255,255,255,0.08);">
                <div style="font-size:0.72rem; color:#94a3b8; font-weight:700;">DHAN MARKET DATA FEED</div>
                <div style="display:flex; justify-content:space-between; margin-top:6px; font-size:0.8rem;">
                  <span>Latency: <strong style="color:#34d399;" id="oaFeedLatency">14 ms</strong></span>
                  <span>Feed Quality: <strong style="color:#38bdf8;">Depth-20</strong></span>
                </div>
                <button style="width:100%; margin-top:8px; padding:6px; background:rgba(56,189,248,0.15); border:1px solid rgba(56,189,248,0.3); color:#38bdf8; border-radius:4px; font-weight:700; cursor:pointer;" onclick="window.oaTestFeed()">⚡ Ping Feed Gateway</button>
              </div>
              <div style="flex:1; background:#03060f; border:1px solid rgba(255,255,255,0.08); border-radius:6px; font-family:monospace; font-size:0.68rem; color:#a5f3fc; padding:8px; overflow-y:auto; max-height:220px;" id="oaFeedLog">
                [16:42:01] Connected wss://api-feed.dhan.co<br>
                [16:42:02] Subscribed Code 20 (20-Depth) BHEL [BSE_EQ:438]<br>
                [16:42:05] Tick Packet: LTP 416.90 | Vol 466<br>
              </div>
            </div>

            <!-- Tab 3: Connect Broker -->
            <div class="oa-pane" id="oa-pane-broker" style="padding:10px; gap:8px;">
              <div style="font-size:0.72rem; color:#94a3b8; font-weight:700;">SELECT BROKER (37+ APIS)</div>
              <select style="width:100%; background:#03060f; border:1px solid rgba(255,255,255,0.1); color:#fff; padding:6px; border-radius:4px; font-size:0.75rem;" onchange="document.getElementById('oaBrokerTitle').innerText = this.options[this.selectedIndex].text + ' Configuration';">
                <option value="dhan">⚡ Dhan</option>
                <option value="zerodha">🪁 Zerodha Kite</option>
                <option value="angelone">👼 Angel One</option>
                <option value="upstox">🚀 Upstox</option>
                <option value="fyers">📊 Fyers</option>
                <option value="shoonya">🛡️ Shoonya</option>
              </select>
              <div style="background:rgba(255,255,255,0.03); padding:10px; border-radius:6px; border:1px solid rgba(255,255,255,0.08); display:flex; flex-direction:column; gap:6px;">
                <div style="font-weight:700; font-size:0.8rem;" id="oaBrokerTitle">Dhan Configuration</div>
                <div><span style="font-size:0.7rem; color:#94a3b8;">Client ID</span><input type="text" value="1113284554" style="width:100%; background:rgba(0,0,0,0.3); border:1px solid rgba(255,255,255,0.1); color:#fff; padding:5px; border-radius:4px; font-size:0.75rem;"></div>
                <div><span style="font-size:0.7rem; color:#94a3b8;">Access Token</span><input type="password" value="************" style="width:100%; background:rgba(0,0,0,0.3); border:1px solid rgba(255,255,255,0.1); color:#fff; padding:5px; border-radius:4px; font-size:0.75rem;"></div>
                <button style="padding:7px; background:#10b981; color:#fff; border:none; border-radius:4px; font-weight:700; cursor:pointer; font-size:0.75rem; margin-top:4px;" onclick="alert('Broker credentials saved & active!')">Save & Activate</button>
              </div>
            </div>
          `;

          mainElem.appendChild(drawer);
          window.dispatchEvent(new Event('resize'));
        }

        function injectTopButton() {
          if (document.getElementById('oa-copilot-top-trigger')) return;
          const navHeader = document.querySelector('header');
          if (!navHeader) return;

          const rightNav = navHeader.querySelector('div:last-child') || navHeader;
          const btn = document.createElement('button');
          btn.id = 'oa-copilot-top-trigger';
          btn.className = 'oa-btn-toggle-top';
          btn.innerHTML = '<span>✨ Ask Gemini</span>';
          btn.onclick = window.oaToggleDrawer;
          rightNav.insertBefore(btn, rightNav.firstChild);
        }

        // Global Handlers
        window.oaSwitchTab = function(tabName) {
          activeTab = tabName;
          const drawer = document.getElementById('oa-inpage-copilot-drawer');
          if (drawer && drawer.classList.contains('collapsed')) {
            drawer.classList.remove('collapsed');
          }
          document.querySelectorAll('.oa-tab-btn').forEach(b => b.classList.remove('active'));
          document.querySelectorAll('.oa-pane').forEach(p => p.classList.remove('active'));
          
          const targetBtn = document.querySelector(`.tab-${tabName}`);
          const targetPane = document.getElementById(`oa-pane-${tabName}`);
          if (targetBtn) targetBtn.classList.add('active');
          if (targetPane) targetPane.classList.add('active');
          window.dispatchEvent(new Event('resize'));
        };

        window.oaToggleDrawer = function() {
          const drawer = document.getElementById('oa-inpage-copilot-drawer');
          if (drawer) {
            drawer.classList.toggle('collapsed');
            window.dispatchEvent(new Event('resize'));
          }
        };

        window.oaAsk = async function(promptText) {
          if (!promptText) return;
          const input = document.getElementById('oaChatInput');
          if (input) input.value = '';
          const feed = document.getElementById('oaChatFeed');
          if (!feed) return;

          feed.innerHTML += `<div class="oa-chat-bubble user">${promptText}</div>`;
          const load = document.createElement('div');
          load.className = 'oa-chat-bubble assistant';
          load.innerHTML = '<em>Analyzing market data with Gemini...</em>';
          feed.appendChild(load);
          feed.scrollTop = feed.scrollHeight;

          try {
            const res = await fetch('/api/chat/trading-assistant', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ message: promptText, symbol: 'BHEL', timeframe: '1m', current_ltp: 416.90 })
            });
            const data = await res.json();
            load.innerHTML = (data.response || data.reply || 'Analysis complete.').replace(/\\n/g, '<br>');
          } catch(e) {
            load.innerHTML = '<span style="color:#f87171;">Could not reach Gemini Assistant.</span>';
          }
          feed.scrollTop = feed.scrollHeight;
        };

        window.oaTestFeed = async function() {
          const log = document.getElementById('oaFeedLog');
          if (log) log.innerHTML += `[${new Date().toLocaleTimeString()}] Pinging Dhan Feed...<br>`;
          try {
            const res = await fetch('/api/data/dhan/verify', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({client_id:'1113284554'}) });
            const data = await res.json();
            const latencyEl = document.getElementById('oaFeedLatency');
            if (latencyEl) latencyEl.innerText = (data.latency_ms || 14) + ' ms';
            if (log) log.innerHTML += `[${new Date().toLocaleTimeString()}] HTTP 200 OK (${data.latency_ms || 14}ms)<br>`;
          } catch(e) {
            if (log) log.innerHTML += `[${new Date().toLocaleTimeString()}] Ping Active<br>`;
          }
          if (log) log.scrollTop = log.scrollHeight;
        };

        // Periodic & Mutation Observer to ensure permanence across React route changes
        const observer = new MutationObserver(() => {
          checkAndInjectTradingCopilot();
        });
        observer.observe(document.body, { childList: true, subtree: true });

        // URL history change listeners
        window.addEventListener('popstate', checkAndInjectTradingCopilot);
        const origPush = history.pushState;
        history.pushState = function() {
          origPush.apply(this, arguments);
          setTimeout(checkAndInjectTradingCopilot, 50);
        };
        const origReplace = history.replaceState;
        history.replaceState = function() {
          origReplace.apply(this, arguments);
          setTimeout(checkAndInjectTradingCopilot, 50);
        };

        setInterval(checkAndInjectTradingCopilot, 400);
      })();
    </script>
