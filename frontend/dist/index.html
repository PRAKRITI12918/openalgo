<body>
  <div id="root"></div>

  <!-- Floating "Ask me" Chatbot Widget (Matches Image 1) -->
  <div id="oa-trading-gemini-root">

    <!-- Glowing Capsule Pill -->
    <div class="oa-gemini-pill" id="oaGeminiPill">
      <div class="oa-soundwave-icon">
        <div class="oa-soundwave-bar"></div>
        <div class="oa-soundwave-bar"></div>
        <div class="oa-soundwave-bar"></div>
        <div class="oa-soundwave-bar"></div>
      </div>
      <span class="oa-gemini-pill-text">Ask me</span>
    </div>

    <!-- Expanded Dialog -->
    <div class="oa-gemini-chat-dialog" id="oaGeminiDialog">
      <div class="oa-dialog-header">
        <div class="oa-dialog-header-title">
          <div class="oa-soundwave-icon" style="width:22px;height:22px;">
            <div class="oa-soundwave-bar" style="height:6px;"></div>
            <div class="oa-soundwave-bar" style="height:12px;"></div>
            <div class="oa-soundwave-bar" style="height:10px;"></div>
            <div class="oa-soundwave-bar" style="height:5px;"></div>
          </div>
          <span>Ask me · Quantitative Assistant</span>
          <span class="oa-tag-dhan">Dhan Live</span>
        </div>
        <div class="oa-dialog-btn-group">
          <button type="button" class="oa-dialog-action-btn" id="oaClearChatBtn">Clear</button>
          <button type="button" class="oa-dialog-action-btn" id="oaCloseDialogBtn">Close</button>
        </div>
      </div>

      <div class="oa-dialog-chips">
        <button type="button" class="oa-chip-btn" data-prompt="Analyze trend, momentum and key pivot levels">Trend &
          Pivots</button>
        <button type="button" class="oa-chip-btn" data-prompt="Calculate Support and Resistance levels">Support &
          Resistance</button>
        <button type="button" class="oa-chip-btn" data-prompt="Check Dhan margin and available funds">Margin &
          Funds</button>
        <button type="button" class="oa-chip-btn" data-prompt="List active open positions and PnL">Open
          Positions</button>
      </div>

      <div class="oa-dialog-messages" id="oaDialogMessages">
        <!-- Populated from localStorage -->
      </div>

      <form class="oa-dialog-input-area" id="oaChatForm">
        <input type="text" class="oa-input-box" id="oaChatInput"
          placeholder="Ask about active chart, technicals, or trade..." autocomplete="off" />
        <button type="submit" class="oa-send-btn">Send</button>
      </form>
    </div>
  </div>

  <script>
    (function () {
      const STORAGE_KEY = 'oa_trading_chat_history_v2';

      const rootWidget = document.getElementById('oa-trading-gemini-root');
      const pill = document.getElementById('oaGeminiPill');
      const dialog = document.getElementById('oaGeminiDialog');
      const closeBtn = document.getElementById('oaCloseDialogBtn');
      const clearBtn = document.getElementById('oaClearChatBtn');
      const chatForm = document.getElementById('oaChatForm');
      const chatInput = document.getElementById('oaChatInput');
      const messagesBox = document.getElementById('oaDialogMessages');

      let isAiLoading = false;

      // Strip all Emojis
      function removeEmojis(str) {
        if (!str) return '';
        return str.replace(/[\u{1F300}-\u{1F9FF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}\u{1F1E6}-\u{1F1FF}\u{1F600}-\u{1F64F}\u{1F680}-\u{1F6FF}\u{2300}-\u{23FF}\u{2B50}\u{2728}\u{2705}\u{274C}\u{26A0}]/gu, '').trim();
      }

      // LocalStorage Helpers
      function getStoredMessages() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          return raw ? JSON.parse(raw) : [];
        } catch (e) {
          return [];
        }
      }

      function saveMessage(msg) {
        try {
          const list = getStoredMessages();
          list.push(msg);
          if (list.length > 50) list.splice(0, list.length - 50);
          localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
        } catch (e) { }
      }

      function renderStoredMessages() {
        const list = getStoredMessages();
        if (!messagesBox) return;

        if (list.length === 0) {
          messagesBox.innerHTML = `
              <div class="oa-msg assistant">
                <div class="oa-analysis-title">Ask me · Trading Assistant</div>
                <div class="oa-bullet-row">
                  <span class="oa-bullet-dot">›</span>
                  <span class="oa-bullet-text">Connected live to <strong>Dhan Market Data API</strong>. Ask about technical setups, pivots, or 2-step order execution.</span>
                </div>
              </div>
            `;
          return;
        }

        messagesBox.innerHTML = '';
        list.forEach(item => {
          const div = document.createElement('div');
          div.className = item.role === 'user' ? 'oa-msg user' : 'oa-msg assistant';
          if (item.role === 'user') {
            div.textContent = item.content;
          } else {
            div.innerHTML = item.html || parseToStructuredHTML(item.content);
            if (item.orderConfirmation) {
              const oc = item.orderConfirmation;
              const ocDiv = document.createElement('div');
              ocDiv.className = 'oa-order-card';
              ocDiv.innerHTML = `
                  <div style="font-weight:bold;color:#e9d5ff;margin-bottom:4px;">Confirm Order Execution</div>
                  Action: <strong>${oc.action}</strong> | ${oc.quantity} Qty ${oc.symbol}<br>
                  Est. Price: ~₹${oc.estimated_price} | Value: ₹${Number(oc.estimated_cost).toLocaleString()}
                  <button type="button" class="oa-order-btn" onclick="executeDhanConfirmedOrder('${oc.token}')">
                    Confirm & Place Dhan Order
                  </button>
                `;
              div.appendChild(ocDiv);
            }
          }
          messagesBox.appendChild(div);
        });
        messagesBox.scrollTop = messagesBox.scrollHeight;
      }

      // Initialize history from localStorage
      renderStoredMessages();

      // Ensure default chart symbol (SENSEX / BSE_INDEX) is initialized if empty
      try {
        const symbolKeys = [
          'oa-trading-0-symbol',
          'oa-trading-pane-0-symbol',
          'oa-trading-symbol',
          '-symbol'
        ];
        symbolKeys.forEach(k => {
          if (!localStorage.getItem(k)) {
            localStorage.setItem(k, JSON.stringify({ symbol: 'SENSEX', exchange: 'BSE_INDEX' }));
          }
        });
      } catch (e) { }

      // Route Tracking for /trading
      function checkRoute() {
        const isTrading = window.location.pathname.startsWith('/trading');
        if (rootWidget) {
          rootWidget.style.display = isTrading ? 'flex' : 'none';
        }
      }

      const pushState = history.pushState;
      history.pushState = function () {
        pushState.apply(history, arguments);
        checkRoute();
      };
      const replaceState = history.replaceState;
      history.replaceState = function () {
        replaceState.apply(history, arguments);
        checkRoute();
      };
      window.addEventListener('popstate', checkRoute);
      setInterval(checkRoute, 300);
      checkRoute();

      function openDialog() {
        if (pill) pill.style.display = 'none';
        if (dialog) dialog.classList.add('open');
        if (chatInput) setTimeout(() => chatInput.focus(), 100);
      }

      function closeDialog() {
        if (dialog) dialog.classList.remove('open');
        if (pill) pill.style.display = 'flex';
      }

      if (pill) pill.addEventListener('click', openDialog);
      if (closeBtn) closeBtn.addEventListener('click', closeDialog);

      if (clearBtn) {
        clearBtn.addEventListener('click', () => {
          localStorage.removeItem(STORAGE_KEY);
          renderStoredMessages();
        });
      }

      document.querySelectorAll('.oa-chip-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const prompt = btn.getAttribute('data-prompt');
          if (prompt) sendPrompt(prompt);
        });
      });

      if (chatForm) {
        chatForm.addEventListener('submit', (e) => {
          e.preventDefault();
          const text = chatInput ? chatInput.value.trim() : '';
          if (text) {
            chatInput.value = '';
            sendPrompt(text);
          }
        });
      }

      // Clean Step-by-Step HTML Parser
      function parseToStructuredHTML(rawMarkdown) {
        let text = removeEmojis(rawMarkdown || '');

        text = text.replace(/^###\s*(.*$)/gim, '<div class="oa-analysis-title">$1</div>');
        text = text.replace(/^####\s*(.*$)/gim, '<div class="oa-step-card"><div class="oa-step-tag">Step</div><div class="oa-step-name">$1</div></div>');
        text = text.replace(/\*\*Step\s*(\d+):?\s*([^*]+)\*\*/gim, '<div class="oa-step-card"><div class="oa-step-tag">Step $1</div><div class="oa-step-name">$2</div></div>');
        text = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
        text = text.replace(/`([^`]+)`/g, '<code class="oa-code-pill">$1</code>');
        text = text.replace(/^•\s*(.*$)/gim, '<div class="oa-bullet-row"><span class="oa-bullet-dot">›</span><span class="oa-bullet-text">$1</span></div>');
        text = text.replace(/\n\n/g, '<div style="height:6px;"></div>');
        text = text.replace(/\n/g, '<br>');

        return text;
      }

      // Step-by-Step Progressive Fading Animation
      function animateStepByStep(container, htmlContent, orderConfirmation, rawText) {
        container.innerHTML = '';
        const temp = document.createElement('div');
        temp.innerHTML = htmlContent;

        const nodes = Array.from(temp.childNodes);
        let i = 0;

        function renderNext() {
          if (i < nodes.length) {
            const node = nodes[i].cloneNode(true);
            if (node.nodeType === 1) {
              node.style.opacity = '0';
              node.style.transform = 'translateY(4px)';
              node.style.transition = 'opacity 0.25s ease, transform 0.25s ease';
              container.appendChild(node);
              setTimeout(() => {
                node.style.opacity = '1';
                node.style.transform = 'translateY(0)';
              }, 20);
            } else {
              container.appendChild(node);
            }
            messagesBox.scrollTop = messagesBox.scrollHeight;
            i++;
            setTimeout(renderNext, 140);
          } else {
            if (orderConfirmation) {
              const oc = orderConfirmation;
              const ocDiv = document.createElement('div');
              ocDiv.className = 'oa-order-card';
              ocDiv.innerHTML = `
                  <div style="font-weight:bold;color:#e9d5ff;margin-bottom:4px;">Confirm Order Execution</div>
                  Action: <strong>${oc.action}</strong> | ${oc.quantity} Qty ${oc.symbol}<br>
                  Est. Price: ~₹${oc.estimated_price} | Value: ₹${Number(oc.estimated_cost).toLocaleString()}
                  <button type="button" class="oa-order-btn" onclick="executeDhanConfirmedOrder('${oc.token}')">
                    Confirm & Place Dhan Order
                  </button>
                `;
              container.appendChild(ocDiv);
              messagesBox.scrollTop = messagesBox.scrollHeight;
            }

            // Persist Assistant Message to localStorage
            saveMessage({
              role: 'assistant',
              content: rawText,
              html: htmlContent,
              orderConfirmation: orderConfirmation,
              timestamp: new Date().toISOString()

        const query = searchInput ? searchInput.value.trim() : '';

        try {
          const url = query
            ? `/api/news/search?q=${encodeURIComponent(query)}`
            : `/api/news/feed?tab=${encodeURIComponent(currentNewsTab)}`;
          const res = await fetch(url);
          const data = await res.json();

          const arts = data.articles || [];
          const trending = data.trending_news || [];

          if (feedCol) {
            if (arts.length === 0) {
              feedCol.innerHTML = '<div style="text-align:center;padding:40px;color:#a1a1aa;">No market news found for this selection.</div>';
            } else {
              feedCol.innerHTML = arts.map(art => renderNewsCardHTML(art)).join('');
            }
          }

          if (trendingList && trending.length > 0) {
            trendingList.innerHTML = trending.slice(0, 5).map((t, idx) => `
              <div style="border-bottom:1px solid #27272a;padding-bottom:8px;">
                <div style="color:#a1a1aa;font-size:10px;font-weight:700;text-transform:uppercase;">#${idx+1} ${t.source}</div>
                <a href="${t.source_url || t.url || '#'}" target="_blank" rel="noopener noreferrer" style="font-weight:600;color:#f4f4f5;margin-top:2px;display:block;text-decoration:none;line-height:1.3;" onmouseover="this.style.color='#ffffff'" onmouseout="this.style.color='#f4f4f5'">${t.title}</a>
                <div style="margin-top:4px;"><span class="oa-impact-badge oa-impact-medium">Score ${t.trending_score}</span></div>
              </div>
            `).join('');
          }
        } catch (e) {
          if (feedCol) feedCol.innerHTML = `<div style="color:#fb7185;padding:20px;">News temporarily unavailable. Retrying... (${e.message})</div>`;
        }
      }

      function renderNewsCardHTML(art) {
        const impactClass = art.market_impact === 'HIGH' ? 'oa-impact-high' : (art.market_impact === 'MEDIUM' ? 'oa-impact-medium' : 'oa-impact-low');
        const sourcesText = art.sources_count > 1 ? `<span style="background:#18181b;border:1px solid #27272a;padding:2px 6px;border-radius:4px;font-size:10px;margin-left:6px;color:#a1a1aa;">👥 ${art.sources_count} sources</span>` : '';
        const symbolsTags = (art.symbols || []).map(s => `<span style="background:#18181b;color:#a1a1aa;border:1px solid #27272a;padding:2px 6px;border-radius:4px;font-size:10px;margin-right:4px;font-weight:600;">${s}</span>`).join('');
        const articleUrl = art.source_url || art.url || '#';

        return `
          <div class="oa-news-card">
            <div style="display:flex;align-items:center;justify-content:space-between;font-size:11px;color:#a1a1aa;margin-bottom:8px;">
              <div><strong style="color:#f4f4f5;">${art.source}</strong>${sourcesText}</div>
              <div><span class="oa-impact-badge ${impactClass}">${art.market_impact_label || 'Potential Market Impact: '+art.market_impact}</span></div>
            </div>
            <a href="${articleUrl}" target="_blank" rel="noopener noreferrer" style="font-size:15px;font-weight:700;color:#f4f4f5;line-height:1.35;margin-bottom:8px;display:block;text-decoration:none;" onmouseover="this.style.color='#ffffff'" onmouseout="this.style.color='#f4f4f5'">
              ${art.title}
            </a>
            <div style="font-size:12px;color:#a1a1aa;line-height:1.45;margin-bottom:10px;">
              ${art.summary || ''}
            </div>
            <div style="display:flex;align-items:center;justify-content:space-between;font-size:11px;border-top:1px solid #27272a;padding-top:8px;">
              <div>${symbolsTags}</div>
              <a href="${articleUrl}" target="_blank" rel="noopener noreferrer" style="color:#a1a1aa;font-weight:600;font-size:11px;text-decoration:none;display:inline-flex;align-items:center;gap:4px;" onmouseover="this.style.color='#ffffff'" onmouseout="this.style.color='#a1a1aa'">
                Read Full Story ↗
              </a>
            </div>
          </div>
        `;
      }

      window.filterByWatchlistSymbol = function(sym) {
        const searchInput = document.getElementById('oa-news-search-input');
        if (searchInput) {
          searchInput.value = sym;
          loadNewsFeedData();
        }
      };

      // Wire Tab Buttons
      document.addEventListener('click', (e) => {
        if (e.target && e.target.classList.contains('oa-news-tab-btn') && e.target.hasAttribute('data-tab')) {
          document.querySelectorAll('.oa-news-tab-btn[data-tab]').forEach(b => b.classList.remove('active'));
          e.target.classList.add('active');
          currentNewsTab = e.target.getAttribute('data-tab');
          loadNewsFeedData();
        }
      });

      const refreshBtn = document.getElementById('oa-news-refresh-btn');
      if (refreshBtn) refreshBtn.addEventListener('click', loadNewsFeedData);

      const searchInput = document.getElementById('oa-news-search-input');
      if (searchInput) {
        let searchTimeout = null;
        searchInput.addEventListener('input', () => {
          clearTimeout(searchTimeout);
          searchTimeout = setTimeout(loadNewsFeedData, 350);
        });
      }
    })();
  </script>
</body>

</html>
