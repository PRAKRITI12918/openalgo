<body>
  <div id="root"></div>

  <!-- Floating "Ask me" Chatbot Widget (Matches Image 1) -->
  <div id="oa-trading-gemini-root">

    <!-- Glowing Capsule Pill -->
    <div class="oa-gemini-pill" id="oaGeminiPill">
      <div class="oa-soundwave-icon">
        <div class="oa-soundwave-bar"></div>
        <div class="oa-soundwave-bar"></div>
        <div class="oa-soundwave-bar"></div>
        <div class="oa-soundwave-bar"></div>
      </div>
      <span class="oa-gemini-pill-text">Ask me</span>
    </div>

    <!-- Expanded Dialog -->
    <div class="oa-gemini-chat-dialog" id="oaGeminiDialog">
      <div class="oa-dialog-header">
        <div class="oa-dialog-header-title">
          <div class="oa-soundwave-icon" style="width:22px;height:22px;">
            <div class="oa-soundwave-bar" style="height:6px;"></div>
            <div class="oa-soundwave-bar" style="height:12px;"></div>
            <div class="oa-soundwave-bar" style="height:10px;"></div>
            <div class="oa-soundwave-bar" style="height:5px;"></div>
          </div>
          <span>Ask me · Quantitative Assistant</span>
          <span class="oa-tag-dhan">Dhan Live</span>
        </div>
        <div class="oa-dialog-btn-group">
          <button type="button" class="oa-dialog-action-btn" id="oaClearChatBtn">Clear</button>
          <button type="button" class="oa-dialog-action-btn" id="oaCloseDialogBtn">Close</button>
        </div>
      </div>

      <div class="oa-dialog-chips">
        <button type="button" class="oa-chip-btn" data-prompt="Analyze trend, momentum and key pivot levels">Trend &
          Pivots</button>
        <button type="button" class="oa-chip-btn" data-prompt="Calculate Support and Resistance levels">Support &
          Resistance</button>
        <button type="button" class="oa-chip-btn" data-prompt="Check Dhan margin and available funds">Margin &
          Funds</button>
        <button type="button" class="oa-chip-btn" data-prompt="List active open positions and PnL">Open
          Positions</button>
      </div>

      <div class="oa-dialog-messages" id="oaDialogMessages">
        <!-- Populated from localStorage -->
      </div>

      <form class="oa-dialog-input-area" id="oaChatForm">
        <input type="text" class="oa-input-box" id="oaChatInput"
          placeholder="Ask about active chart, technicals, or trade..." autocomplete="off" />
        <button type="submit" class="oa-send-btn">Send</button>
      </form>
    </div>
  </div>

  <script>
    (function () {
      const STORAGE_KEY = 'oa_trading_chat_history_v2';

      const rootWidget = document.getElementById('oa-trading-gemini-root');
      const pill = document.getElementById('oaGeminiPill');
      const dialog = document.getElementById('oaGeminiDialog');
      const closeBtn = document.getElementById('oaCloseDialogBtn');
      const clearBtn = document.getElementById('oaClearChatBtn');
      const chatForm = document.getElementById('oaChatForm');
      const chatInput = document.getElementById('oaChatInput');
      const messagesBox = document.getElementById('oaDialogMessages');

      let isAiLoading = false;

      // Strip all Emojis
      function removeEmojis(str) {
        if (!str) return '';
        return str.replace(/[\u{1F300}-\u{1F9FF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}\u{1F1E6}-\u{1F1FF}\u{1F600}-\u{1F64F}\u{1F680}-\u{1F6FF}\u{2300}-\u{23FF}\u{2B50}\u{2728}\u{2705}\u{274C}\u{26A0}]/gu, '').trim();
      }

      // LocalStorage Helpers
      function getStoredMessages() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          return raw ? JSON.parse(raw) : [];
        } catch (e) {
          return [];
        }
      }

      function saveMessage(msg) {
        try {
          const list = getStoredMessages();
          list.push(msg);
          if (list.length > 50) list.splice(0, list.length - 50);
          localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
        } catch (e) { }
      }

      function renderStoredMessages() {
        const list = getStoredMessages();
        if (!messagesBox) return;

        if (list.length === 0) {
          messagesBox.innerHTML = `
              <div class="oa-msg assistant">
                <div class="oa-analysis-title">Ask me · Trading Assistant</div>
                <div class="oa-bullet-row">
                  <span class="oa-bullet-dot">›</span>
                  <span class="oa-bullet-text">Connected live to <strong>Dhan Market Data API</strong>. Ask about technical setups, pivots, or 2-step order execution.</span>
                </div>
              </div>
            `;
          return;
        }

        messagesBox.innerHTML = '';
        list.forEach(item => {
          const div = document.createElement('div');
          div.className = item.role === 'user' ? 'oa-msg user' : 'oa-msg assistant';
          if (item.role === 'user') {
            div.textContent = item.content;
          } else {
            div.innerHTML = item.html || parseToStructuredHTML(item.content);
            if (item.orderConfirmation) {
              const oc = item.orderConfirmation;
              const ocDiv = document.createElement('div');
              ocDiv.className = 'oa-order-card';
              ocDiv.innerHTML = `
                  <div style="font-weight:bold;color:#e9d5ff;margin-bottom:4px;">Confirm Order Execution</div>
                  Action: <strong>${oc.action}</strong> | ${oc.quantity} Qty ${oc.symbol}<br>
                  Est. Price: ~₹${oc.estimated_price} | Value: ₹${Number(oc.estimated_cost).toLocaleString()}
                  <button type="button" class="oa-order-btn" onclick="executeDhanConfirmedOrder('${oc.token}')">
                    Confirm & Place Dhan Order
                  </button>
                `;
              div.appendChild(ocDiv);
            }
          }
          messagesBox.appendChild(div);
        });
        messagesBox.scrollTop = messagesBox.scrollHeight;
      }

      // Initialize history from localStorage
      renderStoredMessages();

      // Ensure default chart symbol (SENSEX / BSE_INDEX) is initialized if empty
      try {
        const symbolKeys = [
          'oa-trading-0-symbol',
          'oa-trading-pane-0-symbol',
          'oa-trading-symbol',
          '-symbol'
        ];
        symbolKeys.forEach(k => {
          if (!localStorage.getItem(k)) {
            localStorage.setItem(k, JSON.stringify({ symbol: 'SENSEX', exchange: 'BSE_INDEX' }));
          }
        });
      } catch (e) { }

      // Route Tracking for /trading
      function checkRoute() {
        const isTrading = window.location.pathname.startsWith('/trading');
        if (rootWidget) {
          rootWidget.style.display = isTrading ? 'flex' : 'none';
        }
      }

      const pushState = history.pushState;
      history.pushState = function () {
        pushState.apply(history, arguments);
        checkRoute();
      };
      const replaceState = history.replaceState;
      history.replaceState = function () {
        replaceState.apply(history, arguments);
        checkRoute();
      };
      window.addEventListener('popstate', checkRoute);
      setInterval(checkRoute, 300);
      checkRoute();

      function openDialog() {
        if (pill) pill.style.display = 'none';
        if (dialog) dialog.classList.add('open');
        if (chatInput) setTimeout(() => chatInput.focus(), 100);
      }

      function closeDialog() {
        if (dialog) dialog.classList.remove('open');
        if (pill) pill.style.display = 'flex';
      }

      if (pill) pill.addEventListener('click', openDialog);
      if (closeBtn) closeBtn.addEventListener('click', closeDialog);

      if (clearBtn) {
        clearBtn.addEventListener('click', () => {
          localStorage.removeItem(STORAGE_KEY);
          renderStoredMessages();
        });
      }

      document.querySelectorAll('.oa-chip-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const prompt = btn.getAttribute('data-prompt');
          if (prompt) sendPrompt(prompt);
        });
      });

      if (chatForm) {
        chatForm.addEventListener('submit', (e) => {
          e.preventDefault();
          const text = chatInput ? chatInput.value.trim() : '';
          if (text) {
            chatInput.value = '';
            sendPrompt(text);
          }
        });
      }

      // Clean Step-by-Step HTML Parser
      function parseToStructuredHTML(rawMarkdown) {
        let text = removeEmojis(rawMarkdown || '');

        text = text.replace(/^###\s*(.*$)/gim, '<div class="oa-analysis-title">$1</div>');
        text = text.replace(/^####\s*(.*$)/gim, '<div class="oa-step-card"><div class="oa-step-tag">Step</div><div class="oa-step-name">$1</div></div>');
        text = text.replace(/\*\*Step\s*(\d+):?\s*([^*]+)\*\*/gim, '<div class="oa-step-card"><div class="oa-step-tag">Step $1</div><div class="oa-step-name">$2</div></div>');
        text = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
        text = text.replace(/`([^`]+)`/g, '<code class="oa-code-pill">$1</code>');
        text = text.replace(/^•\s*(.*$)/gim, '<div class="oa-bullet-row"><span class="oa-bullet-dot">›</span><span class="oa-bullet-text">$1</span></div>');
        text = text.replace(/\n\n/g, '<div style="height:6px;"></div>');
        text = text.replace(/\n/g, '<br>');

        return text;
      }

      // Step-by-Step Progressive Fading Animation
      function animateStepByStep(container, htmlContent, orderConfirmation, rawText) {
        container.innerHTML = '';
        const temp = document.createElement('div');
        temp.innerHTML = htmlContent;

        const nodes = Array.from(temp.childNodes);
        let i = 0;

        function renderNext() {
          if (i < nodes.length) {
            const node = nodes[i].cloneNode(true);
            if (node.nodeType === 1) {
              node.style.opacity = '0';
              node.style.transform = 'translateY(4px)';
              node.style.transition = 'opacity 0.25s ease, transform 0.25s ease';
              container.appendChild(node);
              setTimeout(() => {
                node.style.opacity = '1';
                node.style.transform = 'translateY(0)';
              }, 20);
            } else {
              container.appendChild(node);
            }
            messagesBox.scrollTop = messagesBox.scrollHeight;
            i++;
            setTimeout(renderNext, 140);
          } else {
            if (orderConfirmation) {
              const oc = orderConfirmation;
              const ocDiv = document.createElement('div');
              ocDiv.className = 'oa-order-card';
              ocDiv.innerHTML = `
                  <div style="font-weight:bold;color:#e9d5ff;margin-bottom:4px;">Confirm Order Execution</div>
                  Action: <strong>${oc.action}</strong> | ${oc.quantity} Qty ${oc.symbol}<br>
                  Est. Price: ~₹${oc.estimated_price} | Value: ₹${Number(oc.estimated_cost).toLocaleString()}
                  <button type="button" class="oa-order-btn" onclick="executeDhanConfirmedOrder('${oc.token}')">
                    Confirm & Place Dhan Order
                  </button>
                `;
              container.appendChild(ocDiv);
              messagesBox.scrollTop = messagesBox.scrollHeight;
            }

            // Persist Assistant Message to localStorage
            saveMessage({
              role: 'assistant',
              content: rawText,
              html: htmlContent,
              orderConfirmation: orderConfirmation,
              timestamp: new Date().toISOString()

      function syncNewsNav() {
        if (isAnyOverlayPage()) return; // Overlay pages have their own stabilized headers!

        const allNavs = document.querySelectorAll('body > #root nav, body > #root header nav, nav.sticky');

            activeNav = nav;
            break;

        let existingNews = activeNav.querySelectorAll('a[data-news-nav="true"], a[href="/news"]');

        if (existingNews.length > 1) {
          for (let i = 1; i < existingNews.length; i++) existingNews[i].remove();
        }

        let newsLink = existingNews[0] || null;

      // Route handling for News Page
      const newsPage = document.getElementById('oa-news-page-container');
      let currentNewsTab = 'All';
      let newsDataLoaded = false;
      let newsIsFetching = false;

      function handleRouteNews() {
        const isNews = window.location.pathname === '/news' || window.location.pathname === '/news/';
        if (newsPage) {
          newsPage.classList.toggle('active', isNews);
          newsPage.style.display = isNews ? 'block' : 'none';
          if (isNews && !newsDataLoaded && !newsIsFetching) {
            loadNewsFeedData();
          }
        }
      }

      // Load News Feed Data for /news Page
      async function loadNewsFeedData(force = false) {
        if (newsIsFetching) return;
        if (newsDataLoaded && !force) return;
        newsIsFetching = true;
        const feedCol = document.getElementById('oa-news-feed-col');
        const trendingList = document.getElementById('oa-trending-list');
        const searchInput = document.getElementById('oa-news-search-input');
        const query = searchInput ? searchInput.value.trim() : '';

        try {
          const url = query
            ? `/api/news/search?q=${encodeURIComponent(query)}`
            : `/api/news/feed?tab=${encodeURIComponent(currentNewsTab)}`;
          const res = await fetch(url);
          const data = await res.json();

          const arts = data.articles || [];
          const trending = data.trending_news || [];

          if (feedCol) {
            if (arts.length === 0) {
              feedCol.innerHTML = '<div style="text-align:center;padding:40px;color:#a1a1aa;">No market news found for this selection.</div>';
            } else {
              feedCol.innerHTML = arts.map(art => renderNewsCardHTML(art)).join('');
            }
          }

          if (trendingList && trending.length > 0) {
            trendingList.innerHTML = trending.slice(0, 5).map((t, idx) => `
              <div style="border-bottom:1px solid #27272a;padding-bottom:8px;">
                <div style="color:#a1a1aa;font-size:10px;font-weight:700;text-transform:uppercase;">#${idx+1} ${t.source}</div>
                <a href="${t.source_url || t.url || '#'}" target="_blank" rel="noopener noreferrer" style="font-weight:600;color:#f4f4f5;margin-top:2px;display:block;text-decoration:none;line-height:1.3;" onmouseover="this.style.color='#ffffff'" onmouseout="this.style.color='#f4f4f5'">${t.title}</a>
                <div style="margin-top:4px;"><span class="oa-impact-badge oa-impact-medium">Score ${t.trending_score}</span></div>
              </div>
            `).join('');
          }
        } catch (e) {
          if (feedCol) feedCol.innerHTML = `<div style="color:#fb7185;padding:20px;">News temporarily unavailable. Retrying... (${e.message})</div>`;
        } finally {
          newsIsFetching = false;
          newsDataLoaded = true;
        }
      }

      function renderNewsCardHTML(art) {
        const impactClass = art.market_impact === 'HIGH' ? 'oa-impact-high' : (art.market_impact === 'MEDIUM' ? 'oa-impact-medium' : 'oa-impact-low');
        const sourcesText = art.sources_count > 1 ? `<span style="background:#18181b;border:1px solid #27272a;padding:2px 6px;border-radius:4px;font-size:10px;margin-left:6px;color:#a1a1aa;">👥 ${art.sources_count} sources</span>` : '';
        const symbolsTags = (art.symbols || []).map(s => `<span style="background:#18181b;color:#a1a1aa;border:1px solid #27272a;padding:2px 6px;border-radius:4px;font-size:10px;margin-right:4px;font-weight:600;">${s}</span>`).join('');
        const articleUrl = art.source_url || art.url || '#';

        return `
          <div class="oa-news-card">
            <div style="display:flex;align-items:center;justify-content:space-between;font-size:11px;color:#a1a1aa;margin-bottom:8px;">
              <div><strong style="color:#f4f4f5;">${art.source}</strong>${sourcesText}</div>
              <div><span class="oa-impact-badge ${impactClass}">${art.market_impact_label || 'Potential Market Impact: '+art.market_impact}</span></div>
            </div>
            <a href="${articleUrl}" target="_blank" rel="noopener noreferrer" style="font-size:15px;font-weight:700;color:#f4f4f5;line-height:1.35;margin-bottom:8px;display:block;text-decoration:none;" onmouseover="this.style.color='#ffffff'" onmouseout="this.style.color='#f4f4f5'">
              ${art.title}
            </a>
            <div style="font-size:12px;color:#a1a1aa;line-height:1.45;margin-bottom:10px;">
              ${art.summary || ''}
            </div>
            <div style="display:flex;align-items:center;justify-content:space-between;font-size:11px;border-top:1px solid #27272a;padding-top:8px;">
              <div>${symbolsTags}</div>
              <a href="${articleUrl}" target="_blank" rel="noopener noreferrer" style="color:#a1a1aa;font-weight:600;font-size:11px;text-decoration:none;display:inline-flex;align-items:center;gap:4px;" onmouseover="this.style.color='#ffffff'" onmouseout="this.style.color='#a1a1aa'">
                Read Full Story ↗
              </a>
            </div>
          </div>
        `;
      }

        const searchInput = document.getElementById('oa-news-search-input');

      function syncRecommendationsNav() {
        if (isAnyOverlayPage()) return;

        const allNavs = document.querySelectorAll('body > #root nav, body > #root header nav, nav.sticky');
        let activeNav = null;
        for (const nav of allNavs) {
          if (nav.closest('#oa-news-page-container') || nav.closest('#oa-recommendations-page-container')) continue;
          if (nav.querySelector('a[href*="/trading"], a[href*="/dashboard"]') || nav.textContent.includes('Trading')) {
            activeNav = nav;
            break;
          }
        }

        if (!activeNav) return;

        let anchor = activeNav.querySelector('a[data-news-nav="true"], a[href="/news"], a[href*="/trading"]') || null;
        let existingRecs = activeNav.querySelectorAll('a[data-recs-nav="true"], a[href="/recommendations"]');

        if (existingRecs.length > 1) {
          for (let i = 1; i < existingRecs.length; i++) existingRecs[i].remove();
        }

        let recsLink = existingRecs[0] || null;

        if (!recsLink && anchor && anchor.parentElement) {
          recsLink = document.createElement('a');
          recsLink.setAttribute('data-recs-nav', 'true');
          recsLink.href = '/recommendations';
          recsLink.title = 'Recommendations';
          recsLink.className = 'oa-nav-rec-item';
          recsLink.innerHTML = `
            <svg style="width:16px;height:16px;margin-right:6px;display:inline-block;vertical-align:text-bottom;flex-shrink:0;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
            </svg>
            <span class="hidden xl:inline">Recommendations</span>
          `;
          recsLink.addEventListener('click', (e) => {
            e.preventDefault();
            history.pushState(null, '', '/recommendations');
            window.dispatchEvent(new Event('popstate'));
            handleRouteRecommendations();
          });
          anchor.parentElement.insertBefore(recsLink, anchor.nextSibling);
        }
      }

      function formatIndianNumber(num) {
        if (num === null || num === undefined || isNaN(num)) return '—';
        return '₹' + Number(num).toLocaleString('en-IN', {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2,
        });
      }

      function parseOptionSymbol(sym) {
        if (!sym) return { underlying: '—', strike: 0, optionType: '', expiry: '' };
        // Clean symbol
        const clean = sym.trim();
        // Match e.g. NIFTY24OCT24200PE or NIFTY 24200 PE
        const match = clean.match(/^([A-Z]+)(\d{1,2}[A-Z]{3}\d{2})?(\d+\.?\d*)(CE|PE)$/i);
        if (match) {
          return {
            underlying: match[1] === 'NIFTY' ? 'NIFTY 50' : match[1],
            expiry: match[2] || '',
            strike: parseFloat(match[3]) || 0,
            optionType: match[4].toUpperCase()
          };
        }
        return { underlying: clean, strike: 0, optionType: '', expiry: '' };
      }

      async function loadRecommendationsData(force = false) {
        const container = document.getElementById('oa-recs-content');
        if (!container) return;
        if (recsIsFetching) return;
        if (recsDataLoaded && !force) return;

        recsIsFetching = true;

        // Only show spinner on initial load if container is empty
        if (!recsDataLoaded || !container.children.length) {
          container.innerHTML = `
            <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 20px;color:#a1a1aa;">
              <svg style="width:36px;height:36px;animation:spin 1s linear infinite;color:#8b5cf6;margin-bottom:12px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 12a9 9 0 1 1-6.219-8.56"/>
              </svg>
              <span style="font-size:14px;font-weight:500;">Loading strategy recommendations...</span>
            </div>
          `;
        }

        let apiKey = '';
        try {
          const auth = JSON.parse(localStorage.getItem('auth-storage') || '{}');
          apiKey = auth.state?.apiKey || localStorage.getItem('api_key') || '';
        } catch (e) {}

        let positions = [];
        let strategyItems = [];
        let fundsData = null;
        let recentOrders = [];

        // 1. Fetch live positions
        try {
          const posRes = await fetch('/api/v1/positionbook', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ apikey: apiKey })
          });
          if (posRes.ok) {
            const pJson = await posRes.json();
            if (pJson && Array.isArray(pJson.data)) {
              positions = pJson.data.filter(p => Number(p.quantity) !== 0);
            }
          }
        } catch (e) {
          console.warn('Live positions fetch warning:', e);
        }

        // 2. Fetch strategy portfolio if positions empty
        if (!positions || positions.length === 0) {
          try {
            const sRes = await fetch('/api/strategy-portfolio', { credentials: 'same-origin' });
            if (sRes.ok) {
              const sJson = await sRes.json();
              if (sJson && sJson.status === 'success' && Array.isArray(sJson.data) && sJson.data.length > 0) {
                strategyItems = sJson.data;
              }
            }
          } catch (e) {
            console.warn('Strategy portfolio fetch warning:', e);
          }
        }

        // 3. Fetch funds
        try {
          const fRes = await fetch('/api/v1/funds', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ apikey: apiKey })
          });
          if (fRes.ok) {
            const fJson = await fRes.json();
            if (fJson && fJson.data) fundsData = fJson.data;
          }
        } catch (e) {}

        // 4. Fetch tradebook/orders for Trade Updates
        try {
          const oRes = await fetch('/api/v1/orderbook', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ apikey: apiKey })
          });
          if (oRes.ok) {
            const oJson = await oRes.json();
            if (oJson && oJson.data) {
              recentOrders = Array.isArray(oJson.data) ? oJson.data : (oJson.data.orders || []);
            }
          }
        } catch (e) {}

        // Map data
        const recData = mapRecommendationData(positions, strategyItems, fundsData, recentOrders);

        if (!recData) {
          // Clean Empty State
          container.innerHTML = `
            <div class="rec-empty-card">
              <div class="rec-empty-icon">
                <svg style="width:26px;height:26px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

                </svg>
              </div>
              <h3 style="font-size:18px;font-weight:700;color:#f4f4f5;margin:0 0 8px 0;">No Active Recommendations</h3>
              <p style="font-size:13px;color:#a1a1aa;max-width:380px;margin:0 auto 24px auto;line-height:1.5;">

              <a href="/trading" class="oa-nav-btn" style="display:inline-flex;align-items:center;gap:8px;padding:10px 22px;background:#8b5cf6;color:#ffffff;border-radius:8px;font-size:13px;font-weight:600;text-decoration:none;">
                <svg style="width:16px;height:16px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5v4"/><rect width="4" height="6" x="7" y="9" rx="1"/><path d="M9 15v4"/><path d="M17 3v2"/><rect width="4" height="8" x="15" y="5" rx="1"/><path d="M17 13v8"/></svg>
                <span>Go to Trading</span>
              </a>
            </div>
          `;
          recsDataLoaded = true;
          recsIsFetching = false;
          return;
        }

        // Render Active Recommendation Card
        container.innerHTML = renderRecommendationCardHTML(recData);
        recsDataLoaded = true;
        recsIsFetching = false;

        // Attach Trade Updates Button Listener
        const updatesBtn = document.getElementById('oa-rec-updates-btn');
        if (updatesBtn && modalOverlay) {
          updatesBtn.addEventListener('click', () => {
            const listEl = document.getElementById('oa-modal-updates-list');
            const tradeIdEl = document.getElementById('oa-modal-trade-id');
            if (tradeIdEl) tradeIdEl.textContent = 'Trade ID: ' + recData.tradeId;

            if (listEl) {
              if (recData.tradeUpdates && recData.tradeUpdates.length > 0) {
                listEl.innerHTML = recData.tradeUpdates.map(u => `
                  <div style="padding:12px;border-bottom:1px solid #27272a;display:flex;justify-content:space-between;align-items:center;">
                    <div>
                      <div style="font-weight:600;font-size:13px;color:#f4f4f5;">${u.message || u.order_id || 'Trade update'}</div>
                      <div style="font-size:11px;color:#71717a;margin-top:2px;">${u.time || ''}</div>
                    </div>
                    <span style="font-size:11px;padding:2px 8px;border-radius:9999px;background:#27272a;color:#a1a1aa;text-transform:uppercase;">
                      ${u.status || 'EXECUTED'}
                    </span>
                  </div>
                `).join('');
              } else {
                listEl.innerHTML = `
                  <div style="text-align:center;padding:32px 16px;color:#a1a1aa;font-size:13px;">
                    No recent order updates recorded for this strategy.
                  </div>
                `;
              }
            }
            modalOverlay.classList.add('open');
          });
        }
      }

      function mapRecommendationData(positions, strategyItems, fundsData, recentOrders) {
        // Collect legs from live positions or strategy portfolio
        let rawLegs = [];
        let symbol = 'NIFTY 50';
        let stratName = 'Options Strategy';
        let currentLtp = 0;
        let tradeId = '';

        if (positions && positions.length > 0) {
          // Look for option positions
          rawLegs = positions.map(p => {
            const info = parseOptionSymbol(p.symbol);
            const qty = Number(p.quantity) || 0;
            const price = Number(p.average_price) || Number(p.buy_price) || Number(p.sell_price) || 0;
            const ltp = Number(p.ltp) || price;
            if (ltp > 0) currentLtp = ltp;
            return {
              side: qty >= 0 ? 'BUY' : 'SELL',
              symbol: p.symbol,
              underlying: info.underlying || p.symbol,
              expiry: info.expiry || p.expiry || '',
              strike: info.strike || 0,
              optionType: info.optionType || '',
              quantity: Math.abs(qty),
              rawQuantity: qty,
              price: price,
              ltp: ltp,
              pnl: Number(p.pnl) || 0
            };
          });

          if (rawLegs[0]) {
            symbol = rawLegs[0].underlying;
            tradeId = positions[0].order_id || positions[0].trade_id || '';
          }
        } else if (strategyItems && strategyItems.length > 0) {
          const strat = strategyItems[0];
          stratName = strat.strategy_name || strat.name || 'Hedged Strategy';
          symbol = strat.underlying || 'NIFTY 50';
          tradeId = String(strat.id || strat.strategy_id || '');

          const legs = strat.legs || strat.portfolio || [];
          rawLegs = legs.map(l => {
            const info = parseOptionSymbol(l.symbol);
            const qty = Number(l.quantity) || 1;
            const side = (l.action || l.side || 'BUY').toUpperCase();
            return {
              side: side,
              symbol: l.symbol || `${symbol} ${l.strike || ''} ${l.option_type || ''}`,
              underlying: symbol,
              expiry: l.expiry || info.expiry || '',
              strike: Number(l.strike) || info.strike || 0,
              optionType: (l.option_type || info.optionType || 'CE').toUpperCase(),
              quantity: Math.abs(qty),
              rawQuantity: side === 'BUY' ? Math.abs(qty) : -Math.abs(qty),
              price: Number(l.price || l.entry_price || 0),
              ltp: Number(l.ltp || l.price || 0),
              pnl: 0
            };
          });
        }

        let isAlgoRecommendation = false;
        if (rawLegs.length === 0) {
          // Provide Algorithmic Strategy Recommendation from Strategy Templates
          isAlgoRecommendation = true;
          stratName = 'Hedged Put Butterfly';
          symbol = 'NIFTY 50';
          tradeId = '12405';
          currentLtp = 24174.20;
          rawLegs = [
            {
              side: 'BUY',
              symbol: 'NIFTY 24300 PE',
              underlying: 'NIFTY 50',
              expiry: 'Current Expiry',
              strike: 24300,
              optionType: 'PE',
              quantity: 75,
              rawQuantity: 75,
              price: 182.50,
              ltp: 182.50,
              pnl: 0
            },
            {
              side: 'SELL',
              symbol: 'NIFTY 24150 PE',
              underlying: 'NIFTY 50',
              expiry: 'Current Expiry',
              strike: 24150,
              optionType: 'PE',
              quantity: 150,
              rawQuantity: -150,
              price: 112.30,
              ltp: 112.30,
              pnl: 0
            },
            {
              side: 'BUY',
              symbol: 'NIFTY 24000 PE',
              underlying: 'NIFTY 50',
              expiry: 'Current Expiry',
              strike: 24000,
              optionType: 'PE',
              quantity: 75,
              rawQuantity: 75,
              price: 58.20,
              ltp: 58.20,
              pnl: 0
            }
          ];
        }

        // Auto-detect strategy name if not explicit
        const buyCount = rawLegs.filter(l => l.side === 'BUY').length;
        const sellCount = rawLegs.filter(l => l.side === 'SELL').length;
        const peCount = rawLegs.filter(l => l.optionType === 'PE').length;
        const ceCount = rawLegs.filter(l => l.optionType === 'CE').length;

        if (rawLegs.length === 3 && peCount === 3 && buyCount === 2 && sellCount === 1) {
          stratName = 'Hedged Put Butterfly';
        } else if (rawLegs.length === 2 && peCount === 2 && buyCount === 1 && sellCount === 1) {
          stratName = 'Bear Put Spread';
        } else if (rawLegs.length === 2 && ceCount === 2 && buyCount === 1 && sellCount === 1) {
          stratName = 'Bull Call Spread';
        } else if (rawLegs.length === 4 && buyCount === 2 && sellCount === 2) {
          stratName = 'Iron Condor';
        } else if (rawLegs.length === 2 && ceCount === 1 && peCount === 1 && buyCount === 2) {
          stratName = 'Long Straddle';
        }

        // Derive market bias
        let status = 'NEUTRAL';
        if (peCount > ceCount) {
          status = 'BEARISH';
        } else if (ceCount > peCount) {
          status = 'BULLISH';
        }

        // Calculate capital required
        let capitalRequired = 0;
        if (fundsData) {
          capitalRequired = Number(fundsData.utiliseddebits) || Number(fundsData.marginused) || Number(fundsData.collateral) || 0;
        }
        if (capitalRequired === 0) {
          // Derive from legs
          capitalRequired = rawLegs.reduce((acc, l) => acc + (l.price * l.quantity), 0);
        }

        // Derive Max Target & Max Loss
        const sortedStrikes = rawLegs.map(l => l.strike).filter(s => s > 0).sort((a, b) => a - b);
        let maxTarget = '—';
        let maxLoss = '—';
        if (sortedStrikes.length >= 2) {
          const spreadWidth = sortedStrikes[sortedStrikes.length - 1] - sortedStrikes[0];
          const estNetDebit = Math.max(10, Math.abs(rawLegs.reduce((acc, l) => acc + (l.side === 'BUY' ? l.price : -l.price), 0)));
          const maxGainPoints = Math.max(0, spreadWidth - estNetDebit);
          const mult = rawLegs[0].quantity || 50;
          maxTarget = formatIndianNumber(maxGainPoints * mult);
          maxLoss = formatIndianNumber(estNetDebit * mult);
        }

        // Dynamic status message
        let statusMessage = 'Trading actively in market; monitoring key support and resistance zones.';
        if (status === 'BEARISH') {
          statusMessage = 'Bearish breakdown triggered. Positions positioned to benefit from downside momentum and theta decay.';
        } else if (status === 'BULLISH') {
          statusMessage = 'Bullish momentum triggered. Strategy aligned for upside breakout with risk protection in place.';
        }

        // Format Trade ID
        if (!tradeId) {
          tradeId = String(Math.floor(10000 + Math.random() * 90000));
        }

        // Timestamp
        const now = new Date();
        const dateStr = now.toLocaleDateString('en-IN', { day: 'numeric', month: 'short' });
        const timeStr = now.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', hour12: true });

        // Trade Updates array
        const tradeUpdates = (recentOrders || []).slice(0, 5).map(o => ({
          order_id: o.orderid || o.order_id || tradeId,
          message: `${(o.transactiontype || o.side || 'ORDER').toUpperCase()} ${o.symbol || symbol} ${o.quantity || ''} @ ₹${o.price || o.averageprice || ''}`,
          time: o.order_timestamp || `${dateStr}, ${timeStr}`,
          status: o.status || 'COMPLETE'
        }));

        return {
          dateStr: `${dateStr}, ${timeStr}`,
          status,
          symbol,
          strategyName: stratName,
          tradeId: '#' + tradeId.replace('#', ''),
          currentPrice: currentLtp > 0 ? formatIndianNumber(currentLtp) : '—',
          maxTarget,
          maxLoss,
          statusMessage,
          capitalRequired: capitalRequired > 0 ? formatIndianNumber(capitalRequired) : '—',
          positions: rawLegs,
          tradeUpdates,
          isAlgoRecommendation
        };
      }

      function renderRecommendationCardHTML(d) {
        const badgeClass = d.status === 'BEARISH'
          ? 'rec-badge-bearish'
          : (d.status === 'BULLISH' ? 'rec-badge-bullish' : 'rec-badge-neutral');

        // Dynamic Strike Timeline calculations
        const strikes = d.positions.map(p => ({
          strike: p.strike,
          side: p.side,
          qty: (p.side === 'BUY' ? '+' : '-') + p.quantity,
          label: p.strike > 0 ? `${p.strike} ${p.optionType}` : p.symbol
        })).filter(s => s.strike > 0);

        // Sort by strike
        strikes.sort((a, b) => a.strike - b.strike);

        let strikeNodesHTML = '';
        if (strikes.length > 0) {
          const minS = strikes[0].strike;
          const maxS = strikes[strikes.length - 1].strike;
          const range = maxS - minS;

          strikeNodesHTML = strikes.map((s, idx) => {
            let pct = 50;
            if (range > 0) {
              pct = Math.round(((s.strike - minS) / range) * 80 + 10);
            } else if (strikes.length > 1) {
              pct = Math.round((idx / (strikes.length - 1)) * 80 + 10);
            }
            const isBuy = s.side === 'BUY';
            return `
              <div class="rec-node" style="left:${pct}%;">

        return `

              <div class="rec-header-top">
                <div style="display:flex;align-items:center;gap:8px;">

                  ${d.isAlgoRecommendation ? '<span style="font-size:10px;font-weight:700;padding:2px 7px;border-radius:9999px;background:rgba(168,85,247,0.25);color:#d8b4fe;border:1px solid rgba(168,85,247,0.4);letter-spacing:0.03em;">RECOMMENDATION</span>' : '<span style="font-size:10px;font-weight:700;padding:2px 7px;border-radius:9999px;background:rgba(16,185,129,0.25);color:#6ee7b7;border:1px solid rgba(16,185,129,0.4);letter-spacing:0.03em;">LIVE POSITION</span>'}
                </div>
                <span class="rec-badge ${badgeClass}">${d.status}</span>
              </div>
              <div class="rec-symbol-row">
                <h2 class="rec-symbol-name">${d.symbol}</h2>
                <span class="rec-trade-id">Trade ID: ${d.tradeId}</span>
              </div>
              <div class="rec-strategy-title">${d.strategyName}</div>
            </div>

            <!-- Body -->
            <div class="rec-card-body">
              <!-- Summary Row -->
              <div class="rec-summary-row">
                <div class="rec-summary-col">
                  <span class="rec-summary-label">Current Price</span>
                  <span class="rec-summary-val">${d.currentPrice}</span>

              <!-- Dynamic Strike Timeline -->
              ${strikes.length > 0 ? `

        const existingMount = document.getElementById('oa-account-switcher-mount');

          existingMount.remove();
        }

        const rightGroup = headerContainer.querySelector('.ml-auto') ||

                           headerContainer.querySelector('.flex.items-center.gap-2') ||
                           headerContainer.querySelector('div:last-child');
        if (!rightGroup) return;

        const mount = document.createElement('div');

        mount.className = 'oa-account-switcher-mount';
        mount.innerHTML = `

              <span>Connected Accounts</span>
              <a href="/broker" class="oa-add-acc-link">+ Add Account</a>
            </div>
            <div class="oa-dropdown-list" id="oa-header-account-list">
              <div style="padding:10px;text-align:center;color:#71717a;font-size:11px;">Loading accounts...</div>
            </div>
          </div>
        `;

        const staticBadge = rightGroup.querySelector('a[href="/broker"]');
        if (staticBadge) staticBadge.style.display = 'none';

        const liveBadge = rightGroup.querySelector('.inline-flex.items-center.rounded-full');
        if (liveBadge && liveBadge.parentNode === rightGroup) {
          rightGroup.insertBefore(mount, liveBadge);
        } else if (rightGroup.firstChild) {
          rightGroup.insertBefore(mount, rightGroup.firstChild);
        } else {
          rightGroup.appendChild(mount);
        }

        const btn = document.getElementById('oa-header-account-btn');
        btn.addEventListener('click', function (e) {

          if (!mount.contains(e.target)) {

          }
        });

        updateSwitcherUI();
      }

      function updateSwitcherUI() {
        const labelEl = document.getElementById('oa-header-account-label');
        const listEl = document.getElementById('oa-header-account-list');

        if (labelEl) {
          if (activeAccount) {
            const bName = activeAccount.broker_name || (activeAccount.broker || '').toUpperCase();
            labelEl.textContent = `${bName} • ${activeAccount.client_id_masked || ''}`;
          } else {
            labelEl.textContent = 'No Account Connected';
          }
        }

        if (listEl) {
          if (accounts.length === 0) {
            listEl.innerHTML = `
              <div style="padding:12px;text-align:center;color:#71717a;font-size:11px;">
                No accounts connected. <a href="/broker" style="color:#818cf8;">Connect a broker</a>
              </div>
            `;
            return;
          }

          listEl.innerHTML = accounts.map(acc => {
            const isActive = acc.is_active || (activeAccount && activeAccount.account_id === acc.account_id);
            const bKey = (acc.broker || '').toLowerCase();
            const initial = bKey === 'flattrade' ? 'FL' : (acc.broker_name || bKey).charAt(0).toUpperCase();

            return `
              <div class="oa-dropdown-item ${isActive ? 'active' : ''}">
                <div class="oa-item-meta">
                  <div class="oa-item-icon ${bKey}">${initial}</div>
                  <div>
                    <div class="oa-item-title">${acc.broker_name}</div>
                    <div class="oa-item-client">${acc.client_id_masked}</div>
                  </div>
                </div>
                <div>
                  ${isActive ? `
                    <span class="oa-active-tag">✓ Active</span>
                  ` : `
                    <button type="button" class="oa-btn-switch-item" data-switch-id="${acc.account_id}">
                      Switch
                    </button>
                  `}
                </div>
              </div>
            `;
          }).join('');

          // Switch button clicks
          listEl.querySelectorAll('.oa-btn-switch-item').forEach(btn => {
            btn.addEventListener('click', async function (e) {
              e.stopPropagation();
              const accId = btn.getAttribute('data-switch-id');
              btn.textContent = '...';
              btn.disabled = true;

              try {
                const res = await fetch('/api/accounts/switch', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  credentials: 'include',
                  body: JSON.stringify({ account_id: accId }),
                });
                const data = await res.json();
                if (res.ok && data.status === 'success') {
                  const mount = document.getElementById('oa-account-switcher-mount');
                  if (mount) mount.classList.remove('open');
                  // Instant reload to re-query active broker data
                  window.location.reload();
                } else {
                  alert(data.message || 'Failed to switch account');
                  btn.textContent = 'Switch';
                  btn.disabled = false;
                }
              } catch (err) {
                alert('Error switching account: ' + err.message);
                btn.textContent = 'Switch';
                btn.disabled = false;
              }
            });
          });
        }
      }

      // Poll/Mount periodically
      setInterval(ensureSwitcherMount, 500);
      ensureSwitcherMount();
      fetchAccounts();

    })();
  </script>
</body>

</html>
